# Mara's releases. A version tag (git tag v0.1.0, pushed) builds Mara on
# Windows and Linux and publishes both as a GitHub release: mara-windows-x64.zip
# and mara-linux-x64.tar.gz. A push to main that changes this file, or a run
# started by hand from the Actions tab, builds them as artifacts only.
#
# Each build: Odin builds the compiler, the view window (`mara view`) and the
# docs' programs are built with it and the docs' run, the package is made,
# and a program is built with the packaged compiler alone. The test suite
# lives outside the repo: run it before tagging.
# The Linux window comes with the SDL3 it was built with (built here, of
# SDL_RELEASE: Ubuntu 24.04 has no package of it), found beside it. The
# package's code/SDL and code/SDL_mixer hold libSDL3 and libSDL3_mixer (of
# SDL_MIXER_RELEASE) for programs, which find them copied beside them.
# Linux builds with Ubuntu 24.04's clang 18: the oldest LLVM Mara's IR is
# checked against (Windows uses tools/, clang 21).
# A failing step's last lines show on the run's page (.github/report.sh).
name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml', '.github/report.sh', '.github/checks/**']
  workflow_dispatch:

env:
  ODIN_RELEASE: dev-2026-05
  SDL_RELEASE: 3.4.4
  SDL_MIXER_RELEASE: 3.2.4

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Odin
        run: |
          source .github/report.sh
          curl -sSfL -o "$RUNNER_TEMP/odin.zip" "https://github.com/odin-lang/Odin/releases/download/$ODIN_RELEASE/odin-windows-amd64-$ODIN_RELEASE.zip"
          7z x "$RUNNER_TEMP/odin.zip" -o"$RUNNER_TEMP/odin" > /dev/null
          odin=$(find "$RUNNER_TEMP/odin" -name odin.exe | head -1)
          cygpath -w "$(dirname "$odin")" >> "$GITHUB_PATH"

      - name: Build the compiler
        run: |
          source .github/report.sh
          # (Its version: the tag's, and the commit — `mara version`.)
          version=""; case "$GITHUB_REF" in refs/tags/v*) version=${GITHUB_REF_NAME#v} ;; esac
          printf 'package mara\n\nMARA_VERSION :: "%s"\nMARA_COMMIT  :: "%s"\n' "$version" "${GITHUB_SHA::7}" > src/version.odin
          odin build src -o:speed -out:mara.exe

      - name: Build the view window
        run: |
          source .github/report.sh
          cd view && ../mara.exe build view -release

      - name: Build and run the docs' programs
        run: |
          source .github/report.sh
          mara="$PWD/mara.exe"
          cp -r doc "$RUNNER_TEMP/doc" && cd "$RUNNER_TEMP/doc"
          for f in *.mara; do
            n=${f%.mara}
            "$mara" build "$n" || { echo "doc/$f doesn't build"; exit 1; }
            timeout 60 "./$n.exe" > /dev/null || { echo "doc/$f doesn't run"; exit 1; }
          done

      - name: Package
        run: |
          source .github/report.sh
          pkg=mara-windows-x64
          git archive --format=zip -o "$RUNNER_TEMP/files.zip" HEAD code runtime tools view doc editor readme README.md LICENSE
          7z x "$RUNNER_TEMP/files.zip" -o"$RUNNER_TEMP/$pkg" > /dev/null
          cp mara.exe "$RUNNER_TEMP/$pkg/"
          cp view/view.exe "$RUNNER_TEMP/$pkg/view/"
          cd "$RUNNER_TEMP" && 7z a -tzip -mx=9 "$GITHUB_WORKSPACE/$pkg.zip" "$pkg" > /dev/null

      - name: Build a program with the package alone
        run: |
          source .github/report.sh
          7z x mara-windows-x64.zip -o"$RUNNER_TEMP/unpacked" > /dev/null
          mkdir -p "$RUNNER_TEMP/hello" && cd "$RUNNER_TEMP/hello"
          printf 'module hello\n\nmain :: () {\n\tprint("Hello there!")\n}\n' > hello.mara
          mara="$RUNNER_TEMP/unpacked/mara-windows-x64/mara.exe" exe=.exe
          "$mara" build hello
          ./hello.exe | grep "Hello there!"
          "$mara" version
          # A runtime error's report from a packaged build: it exits 1, and
          # says the calls that were running.
          mkdir -p "$RUNNER_TEMP/oops" && cd "$RUNNER_TEMP/oops"
          printf 'module oops\n\npick :: fun(xs: []i64, at: i64) -> i64 {\n\treturn xs[at]\n}\n\nmain :: () {\n\txs : [2!]i64 = [1, 2]\n\tprint(pick(xs, 6))\n}\n' > oops.mara
          "$mara" build oops
          rc=0; ./oops$exe > oops.txt 2>&1 || rc=$?
          cat oops.txt
          [ "$rc" = 1 ] || { echo "a runtime error exits with $rc, not 1"; exit 1; }
          grep -q "runtime error: index 6 out of bounds" oops.txt
          grep -q "at pick (oops.mara:4)" oops.txt
          grep -q "at main (oops.mara:9)" oops.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mara-windows-x64
          path: mara-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: clang, lld and Odin
        run: |
          source .github/report.sh
          sudo apt-get update -q && sudo apt-get install -y -q clang lld
          curl -sSfL -o "$RUNNER_TEMP/odin.tar.gz" "https://github.com/odin-lang/Odin/releases/download/$ODIN_RELEASE/odin-linux-amd64-$ODIN_RELEASE.tar.gz"
          mkdir -p "$RUNNER_TEMP/odin" && tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin"
          dirname "$(find "$RUNNER_TEMP/odin" -name odin -type f | head -1)" >> "$GITHUB_PATH"

      - name: Build the compiler
        run: |
          source .github/report.sh
          # (Its version: the tag's, and the commit — `mara version`.)
          version=""; case "$GITHUB_REF" in refs/tags/v*) version=${GITHUB_REF_NAME#v} ;; esac
          printf 'package mara\n\nMARA_VERSION :: "%s"\nMARA_COMMIT  :: "%s"\n' "$version" "${GITHUB_SHA::7}" > src/version.odin
          odin build src -o:speed -out:mara

      - name: SDL3, for the view window
        run: |
          source .github/report.sh
          sudo apt-get install -y -q cmake ninja-build pkg-config patchelf xvfb libgl1-mesa-dri imagemagick \
            libgl-dev libegl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libdbus-1-dev libudev-dev
          curl -sSfL -o "$RUNNER_TEMP/sdl.tar.gz" "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_RELEASE/SDL3-$SDL_RELEASE.tar.gz"
          tar -xzf "$RUNNER_TEMP/sdl.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL3-$SDL_RELEASE" -B "$RUNNER_TEMP/sdl" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF | tail -40
          cmake --build "$RUNNER_TEMP/sdl" | tail -5
          sudo cmake --install "$RUNNER_TEMP/sdl" | tail -5
          sudo ldconfig

      - name: SDL3_mixer, for mara.sdl_mixer
        run: |
          source .github/report.sh
          curl -sSfL -o "$RUNNER_TEMP/mixer.tar.gz" "https://github.com/libsdl-org/SDL_mixer/releases/download/release-$SDL_MIXER_RELEASE/SDL3_mixer-$SDL_MIXER_RELEASE.tar.gz"
          tar -xzf "$RUNNER_TEMP/mixer.tar.gz" -C "$RUNNER_TEMP"
          # (Its own decoders only, as the Windows DLL has them: WAV, OGG, MP3,
          # FLAC, VOC, AIFF, AU. None that needs another library.)
          cmake -S "$RUNNER_TEMP/SDL3_mixer-$SDL_MIXER_RELEASE" -B "$RUNNER_TEMP/mixer" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DSDLMIXER_VENDORED=OFF -DSDLMIXER_TESTS=OFF -DSDLMIXER_EXAMPLES=OFF \
            -DSDLMIXER_FLAC_LIBFLAC=OFF -DSDLMIXER_MP3_MPG123=OFF -DSDLMIXER_VORBIS_VORBISFILE=OFF \
            -DSDLMIXER_GME=OFF -DSDLMIXER_MOD=OFF -DSDLMIXER_MIDI=OFF -DSDLMIXER_OPUS=OFF -DSDLMIXER_WAVPACK=OFF | tail -40
          cmake --build "$RUNNER_TEMP/mixer" | tail -5
          sudo cmake --install "$RUNNER_TEMP/mixer" | tail -5
          sudo ldconfig

      - name: Build the view window
        run: |
          source .github/report.sh
          cd view && ../mara build view -release
          # (Its SDL3 beside it, and looked for there first.)
          cp -L "$(find /usr/lib -name libSDL3.so.0 | head -1)" .
          patchelf --set-rpath '$ORIGIN' view
          libs=$(ldd view)
          echo "$libs"
          case "$libs" in *"not found"*) echo "the window needs a library that isn't here"; exit 1 ;; esac
          case "$libs" in *"libSDL3.so.0 => "*"/view/"*) ;; *) echo "the window doesn't take the SDL3 beside it"; exit 1 ;; esac

      - name: Build and run the docs' programs
        run: |
          source .github/report.sh
          mara="$PWD/mara"
          cp -r doc "$RUNNER_TEMP/doc" && cd "$RUNNER_TEMP/doc"
          for f in *.mara; do
            n=${f%.mara}
            "$mara" build "$n" || { echo "doc/$f doesn't build"; exit 1; }
            timeout 60 "./$n" > /dev/null || { echo "doc/$f doesn't run"; exit 1; }
          done
          # The two profilers' builds, which make the runtime's other objects
          # (the package comes with them all: nothing to compile in its folder).
          "$mara" build profiling -profile time && ./profiling > /dev/null && grep -q "total ms" profile.txt
          "$mara" build memory_profiling -profile memory && ./memory_profiling > /dev/null && grep -q "unused B" memory.txt

      - name: Package
        run: |
          source .github/report.sh
          pkg=mara-linux-x64
          mkdir -p "$RUNNER_TEMP/$pkg"
          git archive HEAD code runtime view doc editor readme README.md LICENSE | tar -x -C "$RUNNER_TEMP/$pkg"
          rm "$RUNNER_TEMP/$pkg/view/SDL3.dll"
          # (code/SDL and code/SDL_mixer: Linux's libraries for programs, in
          # place of Windows' DLLs. `-lSDL3` links the .so; the program, built
          # with an $ORIGIN rpath, loads the .so.0 copied beside it, and
          # libSDL3_mixer the libSDL3 beside itself.)
          find "$RUNNER_TEMP/$pkg/code" \( -name '*.dll' -o -name '*.lib' \) -delete
          for lib in SDL3:SDL SDL3_mixer:SDL_mixer; do
            name=${lib%%:*} dir="$RUNNER_TEMP/$pkg/code/${lib##*:}"
            cp -L "$(find /usr/lib -name "lib$name.so.0" | head -1)" "$dir/"
            ln -s "lib$name.so.0" "$dir/lib$name.so"
          done
          patchelf --set-rpath '$ORIGIN' "$RUNNER_TEMP/$pkg/code/SDL_mixer/libSDL3_mixer.so.0"
          cp mara "$RUNNER_TEMP/$pkg/"
          cp view/view view/libSDL3.so.0 "$RUNNER_TEMP/$pkg/view/"
          # (The runtime's objects, made after its sources: used as they are.)
          cp runtime/mara_crash.o runtime/mara_err.o runtime/mara_prof.o runtime/mara_mem.o "$RUNNER_TEMP/$pkg/runtime/"
          # (Its files root's, not this runner's user's: unpacked as root they keep their owner.)
          tar --owner=0 --group=0 --numeric-owner -czf "$pkg.tar.gz" -C "$RUNNER_TEMP" "$pkg"

      - name: Build a program with the package alone
        run: |
          source .github/report.sh
          mkdir -p "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/hello"
          tar -xzf mara-linux-x64.tar.gz -C "$RUNNER_TEMP/unpacked"
          # (As an install that isn't the user's to write: nothing is made in
          # it. One runtime object taken out first: that one is compiled into
          # the user's cache folder instead.)
          rm "$RUNNER_TEMP/unpacked/mara-linux-x64/runtime/mara_err.o"
          chmod -R a-w "$RUNNER_TEMP/unpacked/mara-linux-x64"
          cd "$RUNNER_TEMP/hello"
          printf 'module hello\n\nmain :: () {\n\tprint("Hello there!")\n}\n' > hello.mara
          mara="$RUNNER_TEMP/unpacked/mara-linux-x64/mara" exe=
          "$mara" build hello
          ./hello | grep "Hello there!"
          "$mara" version
          # A library called from four threads at once, each with its own
          # arena (.github/checks): every call's result right.
          mkdir -p "$RUNNER_TEMP/tlib" && cd "$RUNNER_TEMP/tlib"
          cp "$GITHUB_WORKSPACE/.github/checks/tlib.mara" "$GITHUB_WORKSPACE/.github/checks/host.c" .
          "$mara" build tlib -shared
          cc host.c ./tlib.so -lpthread -o host
          LD_LIBRARY_PATH=. ./host
          # mara.sdl_mixer (.github/checks): libSDL3 and libSDL3_mixer copied
          # from the package beside the program, found there.
          pkgdir="$RUNNER_TEMP/unpacked/mara-linux-x64"
          mkdir -p "$RUNNER_TEMP/mixer" && cd "$RUNNER_TEMP/mixer"
          cp "$GITHUB_WORKSPACE/.github/checks/mixer.mara" .
          "$mara" build mixer
          cp "$pkgdir/code/SDL/libSDL3.so.0" "$pkgdir/code/SDL_mixer/libSDL3_mixer.so.0" .
          libs=$(ldd ./mixer)
          echo "$libs"
          case "$libs" in *"not found"*) echo "the program needs a library that isn't beside it"; exit 1 ;; esac
          case "$libs" in *"libSDL3_mixer.so.0 => $RUNNER_TEMP/mixer/"*) ;; *) echo "the program doesn't take the SDL3_mixer beside it"; exit 1 ;; esac
          ./mixer | tee mixer.txt
          grep -q "decoder: STBVORBIS" mixer.txt
          grep -q "decoder: DRMP3" mixer.txt
          grep -q "generated: 4096 sound true" mixer.txt
          # A runtime error's report from a packaged build: it exits 1, and
          # says the calls that were running.
          mkdir -p "$RUNNER_TEMP/oops" && cd "$RUNNER_TEMP/oops"
          printf 'module oops\n\npick :: fun(xs: []i64, at: i64) -> i64 {\n\treturn xs[at]\n}\n\nmain :: () {\n\txs : [2!]i64 = [1, 2]\n\tprint(pick(xs, 6))\n}\n' > oops.mara
          "$mara" build oops
          rc=0; ./oops$exe > oops.txt 2>&1 || rc=$?
          cat oops.txt
          [ "$rc" = 1 ] || { echo "a runtime error exits with $rc, not 1"; exit 1; }
          grep -q "runtime error: index 6 out of bounds" oops.txt
          grep -q "at pick (oops.mara:4)" oops.txt
          grep -q "at main (oops.mara:9)" oops.txt

      # The packaged window on a display made for it (Xvfb, Mesa's software
      # GL): it should still be running a few seconds in, and a picture of
      # the display is kept (the view-screenshot artifact) to look at. A
      # warning, not a failure: the runner's display isn't a user's.
      - name: Start the packaged view window
        run: |
          source .github/report.sh
          pkg="$RUNNER_TEMP/unpacked/mara-linux-x64"
          cd "$RUNNER_TEMP/hello"
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            "$0/mara" view > view.txt 2>&1
            sleep 10
            if pgrep -f "$0/view/view" > /dev/null; then
              echo "the view window runs"
              # The compiler reaches it: words looked up in its docs, and a
              # second `mara view` moves this window, opening no other.
              "$0/mara" docs append || { echo "mara docs did not reach the window"; exit 1; }
              "$0/mara" view
              sleep 3
              [ "$(pgrep -fc "$0/view/view")" = 1 ] || { echo "a second mara view opened a second window"; exit 1; }
            else
              echo "::warning title=view (linux)::the packaged view window did not stay up under Xvfb: $(tail -c 600 view.txt | tr "\n" " ")"
            fi
            import -window root "$1" || echo "no picture of the display"
          ' "$pkg" "$GITHUB_WORKSPACE/view-linux.png"
          pkill -f "$pkg/view/view" || true
          pkill -f "$pkg/mara" || true

      - uses: actions/upload-artifact@v4
        with:
          name: view-screenshot
          path: view-linux.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: mara-linux-x64
          path: mara-linux-x64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: mara-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Mara $GITHUB_REF_NAME" --generate-notes
